<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="robots" content="noindex" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="https://paperback.moe/pb-logo.svg" />
    <title>Loading...</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  </head>

  <body class="bg-[#1b1b1f] text-gray-200 font-sans p-4 md:p-8 lg:p-12 text-center">
    <header class="flex flex-col items-center relative">
      <div 
        class="absolute w-28 h-28 md:w-40 md:h-40 -top-4 left-1/2 -translate-x-1/2 rounded-full"
        style="
          background: radial-gradient(circle at 30% 30%, rgba(84, 120, 219, 0.4) 0%, transparent 70%),
                      radial-gradient(circle at 70% 70%, rgba(246, 75, 75, 0.4) 0%, transparent 70%);
          filter: blur(25px);
        "
      ></div>
      <div class="relative z-10">
        <img
          class="md:max-h-32 max-h-20 rounded-lg"
          src="https://paperback.moe/pb-logo.svg"
          alt="Repository logo"
        />
      </div>
      <h1 id="repositoryName" class="text-2xl mt-4 sm:text-xl"></h1>
      <p
        class="max-w-xl text-lg leading-snug text-[#f64b4b] mx-auto mt-4 sm:text-base"
      >
        A Paperback extensions repository
      </p>
      <a
        class="addToPaperbackButton inline-block leading-7 mt-4 mx-1 py-2 px-4 text-white bg-[#f64b4b] border-b border-red-700 rounded-full transition-colors duration-100 hover:bg-[#f46565] hover:cursor-pointer"
        onclick="addToPaperback()"
      >
        Add Repository to Paperback
      </a>
    </header>

    <div class="mx-auto text-left">
      <p id="repositoryDescription" class="mt-4 text-center"></p>
      <div class="mt-4">
        <p class="font-bold">Available Sources:</p>
        <div
          id="listDiv"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-4"
        ></div>
      </div>
    </div>

    <script>
      const baseUrl = window.location.toString().replace("index.html", "").replace(/\/$/, '');
      let repository = undefined;

      function getContentRatingClass(rating) {
        const ratingClasses = {
          MATURE: "bg-yellow-500 text-yellow-900",
          ADULT: "bg-red-500 text-red-100",
          SAFE: "bg-green-500 text-green-100",
        };
        return (
          ratingClasses[rating.toUpperCase()] || "bg-gray-500 text-gray-100"
        );
      }

      async function bodyOnLoad() {
        const response = await fetch(`${baseUrl}/versioning.json`);
        const json = await response.json();

        repository = json.repository;
        document.querySelector("head > title").innerText = json.repository.name;
        document.querySelector("#repositoryName").innerText =
          json.repository.name;
        document.querySelector("#repositoryDescription").innerText =
          json.repository.description;

        const listDiv = document.querySelector("#listDiv");
        json.sources.forEach((source) =>
          listDiv.appendChild(createSourceCard(source))
        );
      }

      function createSourceCard(source) {
        const card = document.createElement("div");
        card.className = "bg-zinc-800 rounded-lg shadow-lg overflow-hidden";

        // Desktop Layout
        card.innerHTML = `
          <div class="hidden md:block">
            <div class="p-4 flex items-center space-x-4">
              <img
                src="${baseUrl}/${source.id}/static/${source.icon}"
                alt="${source.name} icon"
                class="w-12 h-12 rounded-full"
              >
              <h3 class="text-xl font-semibold text-gray-200">
                ${source.name}
              </h3>
            </div>
            <div class="p-4 border-t border-zinc-700">
              <p class="text-gray-300 text-sm mb-2">
                Version: ${source.version}
              </p>
              <p class="text-gray-300 mb-4">
                ${source.description}
              </p>
              <div class="text-gray-400 text-sm">
                <span
                  class="inline-block px-2 py-1 rounded text-xs font-semibold ${getContentRatingClass(
                    source.contentRating
                  )}">
                  ${source.contentRating}
                </span>
              </div>
              <button
                onclick="installSource('${source.id}')"
                class="mt-4 py-2 px-4 bg-[#f64b4b] text-white rounded-full hover:bg-[#f46565] transition-colors duration-100 hover:cursor-pointer">
                Install
              </button>
            </div>
          </div>
          <div class="md:hidden p-4">
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-3 flex-1">
                <img
                  src="${baseUrl}/${source.id}/static/${source.icon}"
                  alt="${source.name} icon"
                  class="w-12 h-12 rounded-full"
                >
                <div class="flex flex-col space-y-1">
                  <h3 class="text-lg font-semibold text-gray-200">
                      ${source.name}
                  </h3>
                  <span class="text-sm text-gray-400">
                    v${source.version}
                  </span>
                  <span class="px-2 py-0.5 rounded text-xs font-semibold w-fit ${getContentRatingClass(
                    source.contentRating
                  )}">
                      ${source.contentRating}
                  </span>
                </div>
              </div>
              <button
                onclick="installSource('${source.id}')"
                class="ml-2 py-2 px-4 bg-[#f64b4b] text-white rounded-full hover:bg-[#f46565] transition-colors duration-100 hover:cursor-pointer">
                Install
              </button>
            </div>
          </div>
      `;

        return card;
      }

      function installSource(sourceId) {
        window.location.href = `paperback://installExtensions?data=${btoa(
          JSON.stringify([[sourceId, baseUrl]])
        )}`;
      }

      function addToPaperback() {
        if (!repository) {
          alert("Versioning info is not loaded");
          return;
        }
        window.location.href = `paperback://addRepo?displayName=${encodeURI(
          repository.name
        )}&url=${encodeURI(baseUrl)}`;
      }

      document.addEventListener("DOMContentLoaded", bodyOnLoad);
    </script>
  </body>
</html>
